[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aisec"
version = "1.0.0"
description = "Attack and defence tooling for machine-learning systems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# The platform itself has no third-party dependencies, which is what lets
# `aisec scan model.pkl` run on a machine with no ML stack installed.
dependencies = []

[project.optional-dependencies]
torch = ["torch>=2.0", "numpy"]
images = ["pillow>=9"]
dev = ["pytest>=7"]

[project.scripts]
aisec = "aisec.cli:main"

[tool.setuptools.packages.find]
include = ["aisec*"]

[tool.pytest.ini_options]
testpaths = ["tests", "modules"]
python_files = ["test_*.py"]
addopts = "-q"
